name: Build Image

on:
  pull_request:
    paths:
      - "src/**"
      - "Dockerfile"
      - "entrypoint.sh"

permissions:
  contents: read

env:
  IMAGE: dev-build

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
